spring.application.name=shopflow-orders

# Base de datos — H2 en memoria para desarrollo inicial
# Se reemplazará por PostgreSQL vía Docker Compose en T08
spring.datasource.url=jdbc:h2:mem:shopflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# ShopFlow business properties (T09 — @ConfigurationProperties)
shopflow.orders.max-items-per-order=50
shopflow.orders.default-page-size=20
shopflow.orders.pending-order-ttl-hours=48

# Structured logging (T09)
logging.pattern.console=%d{ISO8601} [%thread] [traceId=%X{traceId}] %-5level %logger{36} - %msg%n

# External services (T10)
shopflow.payments.base-url=http://localhost:8081

# Resilience4j — payment service (T10)
resilience4j.timelimiter.instances.payment.timeoutDuration=2s
resilience4j.retry.instances.payment.maxAttempts=3
resilience4j.retry.instances.payment.waitDuration=500ms
resilience4j.retry.instances.payment.enableExponentialBackoff=true
resilience4j.retry.instances.payment.exponentialBackoffMultiplier=2
resilience4j.circuitbreaker.instances.payment.slidingWindowSize=10
resilience4j.circuitbreaker.instances.payment.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.payment.failureRateThreshold=50
resilience4j.circuitbreaker.instances.payment.waitDurationInOpenState=30s
