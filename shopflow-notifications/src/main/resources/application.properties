spring.application.name=shopflow-notifications
server.port=8082

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notifications-group
spring.kafka.consumer.auto-offset-reset=earliest
# BUG: auto-commit enables commit-before-processing anti-pattern
# Fixed version uses: spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.enable-auto-commit=true
